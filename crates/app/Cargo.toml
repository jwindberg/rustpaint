[package]
name = "rustpaint"
description = "Bill Atkinson's MacPaint, re-created in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
arboard = "3"
rustpaint-engine = { path = "../engine" }
softbuffer = "0.4"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
